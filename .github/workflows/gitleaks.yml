# Scans the working tree for committed secrets on every push and pull request.
# Uses the open-source gitleaks CLI directly (the gitleaks-action requires a
# paid license for organization repos, so we install the binary instead).
name: Secret scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scan the current files on disk (--no-git) rather than full history.
      # History still contains the previously-leaked backend/.env; that exposure
      # is tracked in SECURITY.md with rotation instructions. This gate's job is
      # to block NEW secrets from entering the codebase.
      - name: Scan working tree for secrets
        run: gitleaks detect --source . --no-git --redact --verbose --exit-code 1
