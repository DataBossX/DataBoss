name: Publication policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Enforce public repository boundary
        run: python3 scripts/check_publication_policy.py
