# Lint and run the offline backend test suite.
# See: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
name: Python application

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Focused set needed to import the app and run the offline tests.
        # LLM provider SDKs are imported lazily, so they aren't required here.
        pip install \
          fastapi "uvicorn" aiosqlite python-multipart loguru python-dotenv \
          pillow pytesseract httpx pytest flake8
    - name: Lint with flake8
      run: |
        # Fail the build on real errors: syntax errors and undefined names.
        flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
        # Style issues are reported but non-blocking.
        flake8 backend --count --exit-zero --max-complexity=12 --max-line-length=120 --statistics
    - name: Test with pytest
      run: pytest -q
