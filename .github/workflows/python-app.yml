# Lint and run the offline backend test suite.
# See: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
name: Python application

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Focused set needed to import the app and run the offline tests.
        # LLM provider SDKs are imported lazily, so they aren't required here.
        pip install \
          fastapi "uvicorn" aiosqlite python-multipart loguru python-dotenv \
          pillow pytesseract httpx tenacity pytest ruff mypy
    - name: Lint with ruff
      run: ruff check backend automation
    - name: Type-check with mypy
      run: mypy
    - name: Test with pytest
      run: pytest -q
