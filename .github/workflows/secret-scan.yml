name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  current-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan current tree with Gitleaks
        run: >-
          docker run --rm
          --network none
          --read-only
          --cap-drop ALL
          --security-opt no-new-privileges
          -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir /repo --config /repo/.gitleaks.toml --no-banner --redact
      - name: Scan pull request commit range
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: >-
          docker run --rm
          --network none
          --read-only
          --cap-drop ALL
          --security-opt no-new-privileges
          -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml
          --log-opts="$GITLEAKS_RANGE" --no-banner --redact
      - name: Scan pushed commit range
        if: >-
          github.event_name == 'push' &&
          github.event.before != '0000000000000000000000000000000000000000'
        env:
          GITLEAKS_RANGE: ${{ github.event.before }}..${{ github.sha }}
        run: >-
          docker run --rm
          --network none
          --read-only
          --cap-drop ALL
          --security-opt no-new-privileges
          -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml
          --log-opts="$GITLEAKS_RANGE" --no-banner --redact
