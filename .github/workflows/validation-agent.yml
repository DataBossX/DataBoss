name: Validation Agent

# Scoped to the validation agent module so it never interferes with the
# repo-wide python-app workflow.
on:
  push:
    branches: ["main", "claude/**"]
    paths: ["scripts/validation_agent/**", ".github/workflows/validation-agent.yml"]
  pull_request:
    paths: ["scripts/validation_agent/**", ".github/workflows/validation-agent.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/validation_agent
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (syntax/undefined-name only)
        run: |
          pip install flake8
          flake8 . --exclude=.venv,outputs --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Healthcheck
        run: python tools/healthcheck.py
      - name: Run tests with coverage
        run: python -m pytest tests -v --cov=. --cov-report=term-missing
