name: validation-agent-tests
on:
  push:
    paths:
      - "scripts/validation_agent/**"
      - ".github/workflows/validation_agent_tests.yml"
  pull_request:
    paths:
      - "scripts/validation_agent/**"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/validation_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Healthcheck
        run: python tools/healthcheck.py
      - name: Tests
        run: python -m pytest tests -v --cov=. --cov-report=term-missing
