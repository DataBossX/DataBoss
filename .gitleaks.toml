[extend]
useDefault = true

[[allowlists]]
description = "Known commit that deletes the previously exposed backend credentials"
commits = ["ad02fdebbf88945feb3c215217c1ce16286e5b5d"]

# ca62cbd added Control Tower redaction tests whose fixtures were written as
# literals. The scanner matched generic-api-key on a literal `api_key=<value>`
# pair; the commit also carried a "ghp_"-shaped fixture. All of them are
# fabricated: never issued, never valid, and they grant nothing. Later commits
# replace every such fixture with a value built at runtime, so the working tree
# scans clean and stays clean.
#
# This entry exists only so the pull-request commit-range scan does not keep
# re-reporting those historical blobs. It is scoped to the single commit rather
# than to the test path on purpose: allowlisting the path would leave a standing
# blind spot where a real credential could later hide, whereas this excuses one
# known, superseded commit and nothing else.
[[allowlists]]
description = "Fabricated credential fixtures in ca62cbd, replaced by runtime construction in later commits"
commits = ["ca62cbd080b797d74bd89e6951e56c69920f66a5"]
