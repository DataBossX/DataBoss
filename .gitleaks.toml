# gitleaks configuration for DataBoss.
# Extends the upstream default ruleset (covers OpenAI sk-, AWS AKIA, Google AIza,
# generic high-entropy tokens, private keys, etc.) and adds project-specific rules.
title = "DataBoss gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "databoss-llm-provider-key"
description = "LLM provider API keys (OpenAI/Anthropic/xAI/Qwen/Google)"
# sk-..., sk-ant-..., xai-..., AIza..., or *_API_KEY=<value>
regex = '''(?i)(sk-(ant-)?[a-z0-9_\-]{20,}|xai-[a-z0-9]{20,}|AIza[0-9A-Za-z\-_]{30,}|[A-Z0-9_]*API_KEY\s*=\s*["']?[A-Za-z0-9_\-]{16,})'''
keywords = ["sk-", "xai-", "aiza", "api_key"]

[allowlist]
description = "Non-secret placeholders and example files"
paths = [
  '''\.env\.example$''',
  '''(^|/)\.gitleaks\.toml$''',
  '''(^|/)\.pre-commit-config\.yaml$''',
]
regexes = [
  '''API_KEY\s*=\s*$''',                 # empty placeholder, e.g. OPENAI_API_KEY=
  '''=\s*["']?your_[a-z_]+["']?''',       # your_api_key_here style
  '''=\s*["']?<[^>]+>["']?''',            # <REDACTED> / <value> style
]
