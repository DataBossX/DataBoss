repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: public-boundary-guard
        name: Public boundary guard (no title data in the public repo)
        entry: env PYTHONPATH=src python3 -m databossx.boundary_guard --staged
        language: system
        pass_filenames: false
        always_run: true
