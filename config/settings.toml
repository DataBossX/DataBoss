[site]
base_url = "https://weldrecorder.weldgov.com/web/"
delay_sec = 3.5
sec = 1
township = "7N"
range = "63W"

[paths]
workbook = "Black_Tip_Notice_List_verified_updated_20251028_v7.xlsx"
sheet_dsu = "DSU NOTICE LIST"
sheet_offset = "OFFSET NOTICE LIST"
