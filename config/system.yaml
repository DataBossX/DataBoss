schema_version: "1.0"
mode: local_first
database:
  engine: sqlite
  journal_mode: WAL
command_center:
  poll_seconds: 5
  maximum_job_bytes: 262144
  maximum_job_age_seconds: 86400
  bind: 127.0.0.1
release:
  default_state: HOLD_NO_RELEASE
  technical_verification_is_not_release: true
  human_approval_required: true
security:
  arbitrary_execution: false
  external_writes: false
  secrets_from_environment_only: true
