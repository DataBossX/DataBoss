[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databoss-title-factory"
version = "0.2.0"
description = "Local evidence-controlled title document workflow"
requires-python = ">=3.11"
dependencies = [
  "streamlit==1.59.1",
  "pandas==3.0.3",
  "openpyxl==3.1.5",
  "Pillow==12.3.0",
  "PyMuPDF==1.28.0",
  "pytesseract==0.3.13",
  "pydantic==2.13.4",
  "opencv-python-headless==5.0.0.93",
  "rapidfuzz==3.14.5",
  "python-dotenv==1.2.2",
  "loguru==0.7.3",
]

[tool.pytest.ini_options]
testpaths = ["../tests"]

[tool.setuptools]
packages = ["databoss_title_factory"]

[tool.setuptools.package-dir]
databoss_title_factory = "."
