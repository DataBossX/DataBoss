image:
  repository: evoswarm/api
  tag: latest
  pullPolicy: IfNotPresent

api:
  replicas: 2
  port: 8080

# Per-agent worker deployments are rendered from this list — one template,
# twelve workloads. Replica counts mirror specs/<name>.agent.yaml.
agents:
  - { name: orchestrator,    replicas: 1 }
  - { name: intake,          replicas: 2 }
  - { name: ocr,             replicas: 4 }
  - { name: parser,          replicas: 3 }
  - { name: title-examiner,  replicas: 2 }
  - { name: geo-analyst,     replicas: 2 }
  - { name: royalty-analyst, replicas: 2 }
  - { name: valuation,       replicas: 1 }
  - { name: outreach,        replicas: 2 }
  - { name: compliance,      replicas: 1 }
  - { name: critic,          replicas: 1 }
  - { name: evolver,         replicas: 1 }

env:
  EVOSWARM_POSTGRES_DSN: postgresql://evoswarm:evoswarm@postgres:5432/evoswarm
  EVOSWARM_NEO4J_URI: bolt://neo4j:7687
  EVOSWARM_REDIS_URL: redis://redis:6379/0

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "1", memory: 1Gi }
