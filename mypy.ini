[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
# Typed, dependency-light modules we keep clean. Expand this list as more of the
# codebase gains type coverage.
files = backend/config.py, backend/logging_utils.py, automation/config.py
