; Type-checking configuration for the DataBossX Command Center lane.
;
; Scope is deliberately the Command Center package only. The legacy trees have
; their own history and are outside this lane's write scope, so widening this
; would produce noise nobody is authorized to fix here.

[mypy]
python_version = 3.11
mypy_path = services/control_api
namespace_packages = True
explicit_package_bases = True

; Real defects, not style.
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
no_implicit_optional = True
strict_equality = True
check_untyped_defs = True

; The kernel is intentionally light on annotations in places where the value is
; a database row of mixed type. Requiring full annotations would push toward
; less honest signatures, so those are not enforced yet.
disallow_untyped_defs = False
disallow_incomplete_defs = False
ignore_missing_imports = True

show_error_codes = True
pretty = True
